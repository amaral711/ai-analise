services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: analise_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - analise_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.25-alpine
    container_name: analise_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - analise_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: analise_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: analise_ai
      MYSQL_USER: analise
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - analise_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: analise_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - analise_network

  node:
    image: node:20-alpine
    container_name: analise_node
    profiles: [dev]
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    networks:
      - analise_network
    command: npm run dev

  python-ai:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: analise_python
    restart: unless-stopped
    volumes:
      - huggingface_cache:/cache/huggingface
    networks:
      - analise_network
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

networks:
  analise_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  huggingface_cache:
